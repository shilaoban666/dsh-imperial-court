# 三省六部 —— DSH bundle patch
#
# 发布到 npm 后（或在 profile 目录里 link 本包）用包名：
#   - insert:
#       - id: dsh-sansheng-liubu
#         name: 'dsh-sansheng-liubu'
#
# 本地开发（不改 package.json、直接跑源码）把 name 换成 index.mjs 的绝对路径：
#   name: '<clone 下来的绝对路径>/index.mjs'
- insert:
    - id: dsh-sansheng-liubu
      name: 'dsh-sansheng-liubu'
      config:
        # 留空 = $DSH_HOME/sansheng-liubu
        dataDir: ''
