  <rect x="11" y="10" width="14" height="2.6" rx="1.3" fill="url(#gold)" />
  <rect x="12.5" y="16.7" width="11" height="2.6" rx="1.3" fill="url(#gold)" />
  <rect x="9" y="23.4" width="18" height="2.8" rx="1.4" fill="url(#gold)" />
  <defs>
