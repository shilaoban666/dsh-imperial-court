        slots: {
          inject(name, gen) {
            const it = gen();
            let step = it.next();
            while (!step.done) step = it.next(step.value);
          },
          register(opts, component) { (slots[opts.name] = slots[opts.name] || []).push({ opts, component }); return () => {}; },
        },
        inject(_deps, cb) { cb({ theme: themeApi, sidebarRightTabs, sidebarRight, effect(fn) { fn(); } }); },
      });
    },
  };

  window.__previewBoot = function () {
    const h = React.createElement;
    const entries = name => slots[name] || [];
    const pick = name => entries(name).map(s => s.component);
    const [Main] = pick('main');
    const headerActions = pick('conversation.session.header.actions');
    const overlays = pick('shell.overlay');
    const views = entries('conversation.view');
    const paneBody = key => (entries('sidebar.right.pane.tab').find(e => e.opts.key === key) || {}).component;
    const paneTitle = key => (entries('sidebar.right.pane.tab.title').find(e => e.opts.key === key) || {}).component;

    function FakeChat() {
      return h('div', { className: 'pv-chat' },
        h('div', { className: 'pv-bubble me' }, L('帮我把九月的数据汇总成月报，顺便跑一下测试', 'Turn September\'s data into a monthly report and run the tests')),
        h('div', { className: 'pv-bubble' }, L('好的，已经交给朝堂办理（sansheng_edict）。右侧「各部门沟通」里能看到三省六部的往来；改动都在隔离分支里，批红才合并。', 'Done. I handed it to the Senate (sansheng_edict). Follow the dispatches on the "Senate floor" pane; all edits stay on an isolated branch until you seal it.')));
    }

    function Shell() {
      const [, force] = React.useState(0);
      const [page, setPage] = React.useState(params.get('page') || 'conversation');
      const [view, setView] = React.useState(params.get('view') || 'chat');
      React.useEffect(() => { const fn = () => force(x => x + 1); shellListeners.add(fn); return () => shellListeners.delete(fn); }, []);
      const current = views.find(v => v.opts.id === view);
      const Body = right.active && paneBody(right.active);
      const relang = next => { location.search = `?lang=${next}`; };
      return h(React.Fragment, null,
        h('div', { className: 'pv-bar' },
          h('b', null, L('三省六部 · 预览', 'Imperial Senate · preview')),
          h('span', null, L('真实 client.js + 模拟宿主，数据是假的', 'the real client.js on a mock host; demo data')),
          h('span', { className: 'sp' }),
          h('button', { onClick: () => relang(db.ui.locale === 'en' ? 'zh' : 'en') }, db.ui.locale === 'en' ? '中文 · 三省六部' : 'English · Rome'),
          h('button', { onClick: () => { mode = mode === 'dark' ? 'light' : 'dark'; paintTokens(); force(x => x + 1); } }, L('明暗：', 'Mode: ') + (mode === 'dark' ? L('深', 'dark') : L('浅', 'light'))),
          h('button', { onClick: () => { window.__preview.stop(); startSim(BRIEF()); } }, L('重新演示朝会', 'Replay the session'))),
        h('div', { className: 'pv-shell' },
          h('div', { className: 'pv-rail' },
            h('div', { className: 'item' + (page === 'conversation' ? ' active' : ''), title: 'Session', onClick: () => setPage('conversation') }, '◎'),
            h('div', { className: 'item' + (page === 'plugin' ? ' active' : ''), title: 'Plugin', onClick: () => setPage('plugin') }, h(pick('sidebar.panellist')[0] || 'span'))),
          page === 'plugin'
            ? h('div', { className: 'pv-main', style: { overflow: 'hidden' } }, h(Main))
            : h('div', { className: 'pv-main' },
                h('div', { className: 'pv-convo' },
                  h('b', { style: { color: 'var(--dsw-alias-label-primary)' } }, L('月报与测试', 'Monthly report & tests')),
                  h('div', { className: 'pv-views' },
                    [['chat', L('对话', 'Chat')], ['trajectory', L('轨迹', 'Trajectory')], ...views.map(v => [v.opts.id, v.opts.label()])].map(([id, label]) =>
                      h('button', { key: id, className: view === id ? 'on' : '', onClick: () => setView(id) }, label))),
                  h('span', { className: 'sp' }),
                  headerActions.map((C, i) => h(C, { key: i })),
                  h('button', { className: 'pv-toggle', title: 'Right pane', onClick: () => { right.open = !right.open; force(x => x + 1); } }, '▥')),
                h('div', { className: 'pv-body' },
                  h('div', { className: 'pv-view' },
                    current ? h(current.component, current.opts.inject ? current.opts.inject('demo-session') : {})
                      : view === 'chat' ? h(FakeChat) : h('div', { className: 'pv-chat' }, L('（轨迹视图：DSH 自带）', '(Trajectory view: built into DSH)'))),
                  right.open ? h('div', { className: 'pv-right' },
                    h('div', { className: 'pv-right-tabs' },
                      right.tabs.map(id => h('button', { key: id, className: right.active === id ? 'on' : '', onClick: () => { right.active = id; force(x => x + 1); } }, h(paneTitle(id) || 'span'))),
                      h('button', { className: right.active === null ? 'on' : '', title: 'Add', onClick: () => { right.active = null; force(x => x + 1); } }, '+')),
                    h('div', { className: 'pv-right-body' },
                      Body ? h(Body, {})
                        : h('div', { className: 'pv-guide' },
                            h('div', { className: 'pv-guide-t' }, L('打开页签（右侧面板的「+」页）', 'Open a tab (the right pane\'s "+" page)')),
                            [L('文件', 'Files'), L('浏览器', 'Browser'), L('终端', 'Terminal')].map(t => h('div', { key: t, className: 'pv-guide-item dim' }, h('span', { className: 'ic' }), t)),
                            rightTypes.flatMap(def => (def.guide || []).map(g => h('button', { key: g.id, className: 'pv-guide-item', onClick: () => sidebarRight.openTab(def.kind) },
                              h(g.icon, { size: 26 }), h('span', null, h('b', null, g.title()), h('small', null, g.description())))))))) : null))),
        overlays.map((C, i) => h(C, { key: i })));
    }
    paintTokens();
    sidebarRight.openTab(params.get('pane') || 'sansheng-chat');
    ReactDOM.createRoot(document.getElementById('root')).render(h(Shell));
    // 截图用：进到插件页后点第 N 个页签
    const tab = Number(params.get('tab'));
    if (tab) setTimeout(() => { const el = document.querySelectorAll('.ssl-nav [role=tab]')[tab - 1]; if (el) el.click(); }, 600);
    if (params.get('modal') === '1') setTimeout(() => { const el = document.querySelector('.ssl-header-btn'); if (el) el.click(); }, 600);
  };
})();
</script>
<script>
  // 每次都取最新的 client.js（http.server 不带缓存头，浏览器会拿旧的）
  (function () {
    const t = Date.now();
    import('./lib/regime.mjs?t=' + t).then(m => {
      window.__regime = m;
      const s = document.createElement('script');
      s.src = 'client.js?t=' + t;
      s.onload = () => window.__previewBoot();
      document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
