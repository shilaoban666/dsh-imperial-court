name: CI

on:
  push:
    branches: [master, dev, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # 零依赖：没有 npm install。测试用真的 git 仓库和假 CLI 跑完整朝会。
      - name: Syntax check
        run: node --check index.mjs && node --check client.js
      - name: Test
        run: npm test
